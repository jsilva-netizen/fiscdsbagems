evidencia = """
22 políticas restritivas em 11 tabelas (fiscalização e CATERS), criadas pela migration 135, limitam o usuário de teste e2e (id fixo) às linhas que ele criou. Existem também nas migrations, então não aparecem como divergência. Mostram que os testes automatizados escrevem em produção.
"""
