[[achado]]
id = "A-038"
titulo = "Confirmação de e-mail na aprovação existe só nas migrations"
objetos = ["tabela:profiles"]
evidencia = """
Nas migrations (027), aprovar o perfil confirma o e-mail da conta; produção não tem a função nem o gatilho. As 8 contas de produção têm e-mail confirmado.
"""
risco = """
Sem saber se o login exige e-mail confirmado, o fluxo de aprovação do sistema novo pode travar ou dispensar a confirmação sem querer.
"""
opcoes = ["""
Exigir confirmação de e-mail pelo próprio usuário.
""", """
Aprovação do admin confirma o e-mail.
""", """
Não exigir confirmação.
"""]
recomendacao = """
Decidir com a configuração de autenticação de produção (externos.toml).
"""
situacao = "decidido"
decisao = """
Decisão do responsável (2026-09-30): sistema público/institucional, sem cadastro pelo próprio usuário. O admin cria a conta e o perfil (papel, diretoria, câmara, entidade). No primeiro login, e no login em um aparelho novo, o usuário confirma a identidade com um código enviado ao e-mail (verificação em duas etapas). Isso substitui a confirmação de e-mail e a aprovação de cadastro do sistema atual.
"""
decidido_por = "jsilva"
decidido_em = "2026-09-30"

