Não levar as políticas; no sistema novo, testes automatizados rodam em ambiente próprio, sem acesso a produção.
""", """
Levar um mecanismo equivalente: usuário de teste restrito em produção.
"""]
recomendacao = """
Opção 1: ambiente de homologação com dados sintéticos e nenhum usuário de teste em produção.
"""
situacao = "decidido"
decisao = """
Aprovada a recomendação: opção 1 — Não levar as políticas; no sistema novo, testes automatizados rodam em ambiente próprio, sem acesso a produção. (Opção 1: ambiente de homologação com dados sintéticos e nenhum usuário de teste em produção.)
"""
decidido_por = "jsilva"
decidido_em = "2026-09-30"

