  "funcao:enforce_profile_security()",
]

[objeto."coluna:profiles.camara_tecnica_id"]
significado = """
Câmara técnica do usuário. Limita o que fiscal e coordenador veem por câmara
(`can_access_camara`): sem câmara, veem todas; com câmara, veem a sua e os registros sem câmara.
Também define quem é usuário do CATERS (`is_caters_user`) e a câmara que a interface abre.

Escolhida no cadastro por fiscal e coordenador; só um admin ativo altera
(`enforce_profile_security`).
"""
fonte = [
  "funcao:can_access_camara(text)",
  "funcao:is_caters_user()",
  "src/hooks/useModulo.js:88",
  "src/pages/Register.jsx:108",
]

[objeto."gatilho:public.profiles.trg_enforce_profile_security"]
efeito = """
Antes de inserir ou alterar um perfil, impede que quem não é admin ativo se dê privilégios.

- **Na inserção:** papel diferente de fiscal, diretor ou prestador vira `fiscal`, e o perfil fica
  inativo.
- **Na alteração:** papel, `ativo`, prestador, diretoria e câmara voltam ao valor anterior.
- **Sem usuário logado** (gatilho de cadastro, chave de serviço), não interfere.

Comportamento desde a migration 137. Antes, o papel de quem executava era lido mesmo com o perfil
inativo.
"""
fonte = ["funcao:enforce_profile_security()", "supabase/migrations/137_fix_signup_privilege_escalation.sql"]

[objeto."politica:public.profiles.Admins can delete profiles"]
descricao = """
Admin ativo exclui qualquer perfil. Desde a migration 137, só para logados e via `get_my_role()`;
antes, lia o papel direto da tabela, sem olhar `ativo`, e valia também para o papel `public`.
"""
fonte = ["supabase/migrations/137_fix_signup_privilege_escalation.sql"]

[objeto."politica:public.profiles.Admins can update any profile"]
descricao = """
Admin ativo altera qualquer perfil. Mesma mudança da migration 137 que a política de exclusão. É
redundante com `profiles_admin_all` e `Admins e coordenadores gerenciam perfis`.
"""
fonte = ["supabase/migrations/137_fix_signup_privilege_escalation.sql"]

[objeto."politica:public.profiles.Admins e coordenadores gerenciam perfis"]
descricao = """
Admin e coordenador ativos leem, criam, alteram e excluem qualquer perfil. O gatilho
`trg_enforce_profile_security` impede o coordenador de mudar papel, aprovação e vínculos. Ainda
assim, ele pode excluir perfis e alterar nome e e-mail de qualquer usuário, e a tela de usuários
não oferece isso a ele.
"""
fonte = ["funcao:get_my_role()", "gatilho:public.profiles.trg_enforce_profile_security"]

[objeto."politica:public.profiles.Edição Própria"]
descricao = """
O usuário altera o próprio perfil. Não tem `WITH CHECK` e vale para o papel `public`, mas
anônimo não tem `auth.uid()`, então na prática só vale para logados. O gatilho impede a troca de
papel, aprovação e vínculos. Redundante com `profiles_self_update` e `Usuários comuns atualizam
apenas dados de contato próprios`.
"""
fonte = ["gatilho:public.profiles.trg_enforce_profile_security"]

[objeto."politica:public.profiles.Inserção Própria"]
descricao = """
O usuário logado insere um perfil com o próprio id. É o caminho de reserva caso o perfil não
exista; o gatilho força papel permitido e inativo. Na prática não é usado: o perfil é criado pelo
gatilho de cadastro na mesma transação da conta.
"""
fonte = ["gatilho:public.profiles.trg_enforce_profile_security", "funcao:handle_new_user()"]

[objeto."politica:public.profiles.Leitura pública de perfis"]
descricao = """
Logado lê o próprio perfil. Quem tem perfil ativo lê todos (lista de usuários, nomes de fiscais).
Desde a migration 137; antes, qualquer logado lia todos, inclusive contas não aprovadas.
"""
fonte = ["supabase/migrations/137_fix_signup_privilege_escalation.sql", "src/pages/GerenciarUsuarios.jsx:27"]

[objeto."politica:public.profiles.Usuários comuns atualizam apenas dados de contato próprios"]
descricao = """
O usuário altera o próprio perfil. O nome promete "apenas dados de contato", mas quem limita os
campos é o gatilho, não a política. Redundante com `Edição Própria` e `profiles_self_update`.
"""
fonte = ["gatilho:public.profiles.trg_enforce_profile_security"]

[objeto."politica:public.profiles.profiles_admin_all"]
descricao = "Admin ativo lê, cria, altera e exclui qualquer perfil (via `current_role()`)."
fonte = ["funcao:current_role()"]

