# Core — perfis de usuário. As políticas "Leitura Geral" e "Enable insert for authenticated users and
# during sign up" não são anotadas: foram removidas de produção em 2026-09-29 (migration 137) e
# somem do catálogo quando o inventário for refeito.

[objeto."tabela:profiles"]
modulo = "core"
finalidade = """
Perfil de cada usuário do sistema, um para um com a conta de autenticação (`auth.users`): papel,
se foi aprovado (`ativo`), diretoria, câmara técnica e, para o papel prestador, a entidade regulada
que ele representa.

É a base de todas as regras de acesso: `get_my_role`, `current_role`, `get_my_camara_tecnica`,
`get_my_diretoria`, `get_my_prestador_id` e `current_prestador_servico_id` leem esta tabela, e as
políticas de quase todas as outras tabelas chamam essas funções.

Ciclo de vida: o gatilho de cadastro (`handle_new_user`) cria o perfil inativo com os dados
escolhidos na tela de cadastro; um admin aprova, ajusta papel e vínculos ou exclui na tela de
usuários.
"""
fonte = [
  "funcao:handle_new_user()",
  "src/pages/Register.jsx:100",
  "src/pages/GerenciarUsuarios.jsx:92",
  "src/pages/GerenciarUsuarios.jsx:149",
  "src/lib/AuthContext.jsx:128",
]

[objeto."coluna:profiles.id"]
significado = """
Identificador do usuário. É o mesmo id da conta em `auth.users` (chave estrangeira
`profiles_id_fkey`). As regras de acesso comparam `auth.uid()` com ele.
"""
fonte = ["restricao:profiles.profiles_id_fkey", "funcao:get_my_role()"]

[objeto."coluna:profiles.email"]
significado = """
E-mail da conta, copiado de `auth.users` pelo gatilho de cadastro. Não há gatilho que o atualize
se o e-mail da conta mudar depois.

Usado para excluir usuário por e-mail (`admin_delete_user_by_email`) e para registrar quem fez a
alteração na auditoria (`process_audit_log`) e em `fiscalizacoes.last_modified_by`
(`set_fiscalizacao_last_modified`).
"""
fonte = [
  "funcao:handle_new_user()",
  "funcao:admin_delete_user_by_email(text)",
  "funcao:process_audit_log()",
  "funcao:set_fiscalizacao_last_modified()",
]

[objeto."coluna:profiles.full_name"]
significado = """
Nome completo informado no cadastro (metadado `full_name`; se vier vazio, o e-mail). Mostrado na
tela de usuários e copiado para `fiscalizacoes.fiscal_nome` quando o fiscal cria a fiscalização
(`set_fiscalizacao_cache_fields`).
"""
fonte = [
  "funcao:handle_new_user()",
  "funcao:set_fiscalizacao_cache_fields()",
  "src/pages/GerenciarUsuarios.jsx:341",
]

[objeto."coluna:profiles.role"]
significado = """
Papel do usuário: `admin`, `coordenador`, `fiscal`, `diretor` ou `prestador`. Em produção há 2
admins, 4 fiscais e 1 prestador.

- **Origem:** o cadastro oferece fiscal, coordenador, diretor e prestador. Desde a migration 137,
  qualquer outro valor pedido no cadastro vira `fiscal`, e `admin` só é atribuído por outro admin
  na tela de usuários.
- **Validação:** o banco não restringe os valores da coluna, e o padrão da coluna em produção é
  `'user'`, que nenhuma regra reconhece.
- **Uso:** o papel só vale nas regras de acesso quando o perfil está ativo (migration 137). A
  interface usa o papel para montar menus e rotas: o prestador fica restrito ao portal.
"""
fonte = [
  "src/pages/Register.jsx:106",
  "funcao:handle_new_user()",
  "funcao:enforce_profile_security()",
  "src/App.jsx:135",
  "src/hooks/useModulo.js:86",
  "supabase/migrations/137_fix_signup_privilege_escalation.sql",
]

[objeto."coluna:profiles.ativo"]
significado = """
Se o usuário foi aprovado por um admin.

- **Valor inicial:** o cadastro sempre grava `false`, embora o padrão da coluna em produção seja
  `true`.
- **Quem altera:** o admin ativa ou desativa na tela de usuários. Ninguém além de um admin ativo
  altera este campo (`enforce_profile_security`).
- **Efeito no banco:** perfil inativo não tem papel nem vínculos nas regras de acesso e só lê o
  próprio perfil (migrations 137 e 138).
- **Efeito na interface:** o login recusa perfil inativo com "Sua conta aguarda aprovação do
  administrador", e a sessão de um usuário desativado é encerrada quando o app está online.
"""
fonte = [
  "funcao:handle_new_user()",
  "src/pages/GerenciarUsuarios.jsx:149",
  "src/lib/AuthContext.jsx:138",
  "src/lib/AuthContext.jsx:303",
  "supabase/migrations/137_fix_signup_privilege_escalation.sql",
]

[objeto."coluna:profiles.created_at"]
significado = "Quando o perfil foi criado (no cadastro)."
fonte = ["funcao:handle_new_user()"]

[objeto."coluna:profiles.updated_at"]
significado = """
Momento da última atualização, mas só é gravado quando o gatilho de cadastro encontra um perfil
já existente com o mesmo id. `profiles` não tem gatilho de `updated_at`, então edições feitas
pela tela de usuários não mudam esta coluna.
"""
fonte = ["funcao:handle_new_user()", "gatilho:public.profiles.trg_enforce_profile_security"]

[objeto."coluna:profiles.prestador_servico_id"]
significado = """
Entidade regulada (`prestadores_servico`) que um usuário de papel `prestador` representa. É o que
limita o prestador aos dados da própria entidade (`get_my_prestador_id`,
`current_prestador_servico_id`).

- **Restrições:** obrigatória para prestador e proibida para os demais papéis, mas as duas
  restrições são `NOT VALID` e só valem para linhas novas ou alteradas. O índice único
  `ux_profiles_prestador_servico_id` permite no máximo um usuário por entidade.
- **Origem:** o usuário escolhe a entidade no cadastro, e o admin confirma ou troca na aprovação.
  A tela grava também o vínculo inverso em `prestadores_servico.user_id`, em passos separados e
  sem transação.
- **Quem altera:** só um admin ativo (`enforce_profile_security`).
"""
fonte = [
  "restricao:profiles.profiles_prestador_must_have_prestador_id",
  "restricao:profiles.profiles_non_prestador_must_not_have_prestador_id",
  "indice:ux_profiles_prestador_servico_id",
  "src/pages/GerenciarUsuarios.jsx:149",
  "src/pages/GerenciarUsuarios.jsx:199",
]

[objeto."coluna:profiles.diretoria_id"]
significado = """
Diretoria do usuário (`dsb`, `dtr` ou `dge`; padrão `dsb`). A interface usa a diretoria para
escolher os módulos e dashboards que o usuário vê. Nenhuma política do banco a usa:
`get_my_diretoria` existe, mas nenhuma política a chama. Só um admin ativo altera
