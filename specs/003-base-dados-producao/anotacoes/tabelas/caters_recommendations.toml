[objeto."coluna:caters_recommendations.created_by"]
significado = "Conta de quem cadastrou ou importou; na importação, o usuário logado."
fonte = ["funcao:caters_import_from_fiscalizacao(p_fiscalizacao_id uuid, p_caters_process_id uuid, p_prazo_dias integer)"]

[objeto."coluna:caters_recommendations.created_at"]
significado = "Quando foi cadastrada ou importada; ordena a lista."
