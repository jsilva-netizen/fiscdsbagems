[objeto."tabela:caters_recommendations"]
modulo = "caters"
finalidade = """
Recomendações e determinações acompanhadas em cada processo da CATERS, com prazo prometido pelo
município, situação, resposta do titular e evidência. Produção tem 27.

- **Importação:** a partir das recomendações e determinações da fiscalização ligada
  (`caters_import_from_fiscalizacao`), com prazo de 30 dias contados do fim da fiscalização e
  prioridade média.
- **Cadastro manual:** também podem ser cadastradas à mão ou extraídas do relatório por IA.
- **Situação:** é derivada na tela a partir do prazo e do cumprimento.
"""
fonte = [
  "funcao:caters_import_from_fiscalizacao(p_fiscalizacao_id uuid, p_caters_process_id uuid, p_prazo_dias integer)",
  "src/lib/caters/recommendations.js:4",
  "src/lib/caters/recommendations.js:40",
  "inventário: dominio_categorico",
]

[objeto."coluna:caters_recommendations.id"]
significado = "Identificador da recomendação acompanhada."
fonte = ["src/lib/caters/recommendations.js:40"]

[objeto."coluna:caters_recommendations.process_id"]
significado = "Processo CATERS; excluir o processo exclui as recomendações."
fonte = ["restricao:caters_recommendations.caters_recommendations_process_id_fkey"]

[objeto."coluna:caters_recommendations.item_code"]
significado = "Código do item no relatório (ex.: 3.1.2), informado à mão."
fonte = ["src/pages/CatersProcessoDetalhe.jsx:1419"]

[objeto."coluna:caters_recommendations.description"]
significado = "Texto da recomendação ou determinação; na importação, copiado da fiscalização."
fonte = ["funcao:caters_import_from_fiscalizacao(p_fiscalizacao_id uuid, p_caters_process_id uuid, p_prazo_dias integer)"]

[objeto."coluna:caters_recommendations.category"]
significado = """
Categoria livre (ex.: UTR Municipal, Unidade de Transbordo, Coleta de RSD, Coleta Seletiva,
Limpeza Urbana).
"""
fonte = ["src/pages/CatersProcessoDetalhe.jsx:545", "inventário: dominio_categorico"]

[objeto."coluna:caters_recommendations.priority"]
significado = "Prioridade: `baixa`, `media` (padrão), `alta` ou `critica` (tipo `caters_recommendation_priority`)."
fonte = ["src/lib/caters/recommendations.js:17"]

[objeto."coluna:caters_recommendations.promised_due_at"]
significado = """
Prazo para cumprir: na importação de recomendação, fim da fiscalização mais 30 dias; na de
determinação, a coluna antiga `determinacoes.prazo`, hoje sempre vazia.
"""
fonte = ["funcao:caters_import_from_fiscalizacao(p_fiscalizacao_id uuid, p_caters_process_id uuid, p_prazo_dias integer)", "coluna:determinacoes.prazo"]

[objeto."coluna:caters_recommendations.status"]
significado = """
Situação (tipo `caters_recommendation_status`): `pendente` (padrão), `em_andamento`, `vencido` ou
`cumprido`. É derivada na tela ao gravar, sem rotina que a atualize:

- com data de cumprimento, `cumprido`;
- com prazo passado, `vencido`;
- senão, o que estava.
"""
fonte = ["src/lib/caters/recommendations.js:4"]

[objeto."coluna:caters_recommendations.fulfilled_at"]
significado = "Data do cumprimento; \"marcar como cumprida\" grava o dia (data UTC do aparelho)."
fonte = ["src/pages/CatersProcessoDetalhe.jsx:557"]

[objeto."coluna:caters_recommendations.evidence_url"]
significado = "Evidência do cumprimento."
fonte = ["src/lib/caters/recommendations.js:28"]
hipotese = true

[objeto."coluna:caters_recommendations.notes"]
significado = "Observações da equipe sobre a recomendação."
fonte = ["src/pages/CatersProcessoDetalhe.jsx:551"]

[objeto."coluna:caters_recommendations.titular_response"]
