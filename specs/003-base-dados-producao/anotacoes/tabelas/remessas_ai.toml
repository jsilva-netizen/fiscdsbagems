[objeto."politica:public.remessas_ai.Acesso total autenticado (DEV)"]
descricao = """
Quem tem perfil ativo, de qualquer papel e câmara, lê, cria, altera e exclui qualquer remessa. É o
que permite ao prestador registrar recebimento e defesa, mas também deixa um prestador alterar a
remessa de outro. Desde a migration 138; antes, valia para qualquer logado.
"""
fonte = ["supabase/migrations/138_fix_open_policies.sql", "src/pages/PortalPrestadorHome.jsx:583"]

[objeto."politica:public.remessas_ai.Fiscais e Admins: acesso por camara em remessas"]
