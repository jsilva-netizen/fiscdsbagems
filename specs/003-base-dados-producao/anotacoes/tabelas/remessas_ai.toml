[objeto."tabela:remessas_ai"]
modulo = "processo_sancionador"
finalidade = """
Remessa (lote) de autos de infração enviada a uma entidade: agrupa os autos de um termo de
notificação e acompanha as etapas com a entidade. Há uma remessa ativa por termo, verificada só
pela tela. **Vazia em produção.**

**Etapas:**

- **`preparada`:** criada na Gestão de Autos.
- **`enviada`:** ao enviar, com a lista dos autos em PDF.
- **`recebida`:** quando o prestador assina todos os autos no portal.
- **`defesa_enviada`:** quando o prestador envia o ofício de defesa.
- **`parecer_enviado`:** quando a equipe encaminha os pareceres assinados.
"""
fonte = [
  "src/pages/GestaoAutos.jsx:418",
  "src/pages/GestaoAutos.jsx:473",
  "src/pages/PortalPrestadorHome.jsx:584",
  "src/pages/PortalPrestadorHome.jsx:738",
  "src/pages/GestaoAutos.jsx:278",
  "inventário: tabelas",
]

[objeto."coluna:remessas_ai.id"]
significado = "Identificador da remessa."
fonte = ["src/lib/offline/repository.ts:1583"]

[objeto."coluna:remessas_ai.termo_id"]
significado = "Termo de notificação da remessa; excluir o termo exclui a remessa."
fonte = ["src/pages/GestaoAutos.jsx:427", "restricao:remessas_ai.remessas_ai_termo_id_fkey"]

[objeto."coluna:remessas_ai.fiscalizacao_id"]
significado = "Fiscalização da remessa; define a câmara pelo gatilho `tr_camara_remessas`."
fonte = ["src/pages/GestaoAutos.jsx:428", "gatilho:public.remessas_ai.tr_camara_remessas"]

[objeto."coluna:remessas_ai.prestador_servico_id"]
significado = "Entidade destinatária; limita o acesso do prestador às próprias remessas."
fonte = ["src/pages/GestaoAutos.jsx:429", "src/pages/PortalPrestadorHome.jsx:187"]

[objeto."coluna:remessas_ai.numero_rfp"]
significado = "Identificação do relatório de fiscalização do termo (ex.: RFP/DSB/<câmara>/<número>/<ano>)."
fonte = ["src/pages/GestaoAutos.jsx:430"]

[objeto."coluna:remessas_ai.numero_tn"]
significado = """
Número do termo de notificação. **Sempre vazio**: a tela lê `termo.numero_tn`, que não existe; o
certo seria `numero_termo_notificacao`.
"""
fonte = ["src/pages/GestaoAutos.jsx:431", "coluna:termos_notificacao.numero_termo_notificacao"]

[objeto."coluna:remessas_ai.status"]
significado = """
Etapa da remessa: `preparada` (padrão), `enviada`, `recebida`, `defesa_enviada` e
`parecer_enviado`. Não é validado pelo banco, e o prestador grava duas das etapas.
"""
fonte = ["src/pages/GestaoAutos.jsx:432", "src/pages/PortalPrestadorHome.jsx:585", "src/pages/PortalPrestadorHome.jsx:739"]

[objeto."coluna:remessas_ai.arquivo_lista_pdf_url"]
