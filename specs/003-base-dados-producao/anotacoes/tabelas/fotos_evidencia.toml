[objeto."tabela:fotos_evidencia"]
modulo = "fiscalizacao"
finalidade = """
Tabela de fotos de evidência por fiscalização ou unidade, **sem uso**: está vazia em produção e
nenhuma tela, função ou edge function a lê ou grava. As fotos da vistoria ficam na lista
`unidades_fiscalizadas.fotos_unidade`. É candidata a descarte, a decidir nos achados.
"""
fonte = ["inventário: tabelas", "tabela:unidades_fiscalizadas"]

[objeto."coluna:fotos_evidencia.id"]
