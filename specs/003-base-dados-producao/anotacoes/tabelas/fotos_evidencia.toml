[objeto."coluna:fotos_evidencia.url"]
significado = "Endereço da foto (tabela sem uso)."
fonte = ["inventário: tabelas"]

[objeto."coluna:fotos_evidencia.bucket_path"]
significado = "Caminho do arquivo no bucket (tabela sem uso)."
fonte = ["inventário: tabelas"]

[objeto."coluna:fotos_evidencia.descricao"]
significado = "Legenda da foto (tabela sem uso)."
fonte = ["inventário: tabelas"]

[objeto."coluna:fotos_evidencia.created_at"]
