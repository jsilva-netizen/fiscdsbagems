[objeto."politica:public.caters_deadline_extensions.authenticated users can manage deadline extensions"]
descricao = """
Quem tem perfil ativo, de qualquer papel e câmara, lê, cria, altera e exclui dilações de qualquer
processo, sem exigir a CATERS. Desde a migration 138; antes, valia para qualquer logado.
"""
fonte = ["supabase/migrations/138_fix_open_policies.sql"]

