[objeto."tabela:caters_notification_reads"]
modulo = "caters"
finalidade = """
Quais avisos do painel da CATERS cada usuário já leu, para não mostrá-los de novo. Os avisos não
ficam no banco: são calculados no painel, e aqui só se guarda a chave lida. Vazia em produção.

Chaves usadas:

- `overdue_response:<processo>:<prazo>`;
- `overdue_recommendation:<recomendação>:<prazo>`;
- `awaiting_analysis:<processo>`.

Como o prazo faz parte da chave, um aviso volta a aparecer quando o prazo muda.
"""
fonte = ["src/pages/CatersDashboard.jsx:123", "src/lib/caters/notificationReads.js:19"]

[objeto."coluna:caters_notification_reads.id"]
significado = "Identificador do registro de leitura."
fonte = ["src/lib/caters/notificationReads.js:19"]

[objeto."coluna:caters_notification_reads.user_id"]
significado = "Usuário que leu; único junto com a chave."
fonte = ["indice:caters_notification_reads_user_key", "restricao:caters_notification_reads.caters_notification_reads_user_id_fkey"]

[objeto."coluna:caters_notification_reads.key"]
significado = "Chave do aviso lido (formatos na finalidade da tabela)."
fonte = ["src/pages/CatersDashboard.jsx:123"]

[objeto."coluna:caters_notification_reads.read_at"]
significado = "Quando o aviso foi marcado como lido."
fonte = ["src/lib/caters/notificationReads.js:16"]

[objeto."coluna:caters_notification_reads.created_at"]
significado = "Quando o registro foi criado."
fonte = ["src/lib/caters/notificationReads.js:19"]

[objeto."politica:public.caters_notification_reads.CATERS notif reads: proprias"]
descricao = "Usuário ativo da CATERS ou admin lê e grava só as próprias leituras."
fonte = ["funcao:is_caters_user()"]
