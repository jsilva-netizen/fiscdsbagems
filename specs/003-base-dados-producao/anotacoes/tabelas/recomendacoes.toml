[objeto."coluna:recomendacoes.numero_recomendacao"]
significado = """
Número na unidade (R1, R2…), dado pelo aparelho (`recomputeRecomendacoesNumeracao`) e mantido na
ordem definida pelo fiscal, reordenável por arrastar. Único por unidade; há dois índices únicos
equivalentes, um deles parcial.
"""
fonte = ["src/lib/offline/repository.ts:795", "indice:recomendacoes_unidade_numero_unq", "indice:ux_recomendacoes_unidade_numero"]

[objeto."coluna:recomendacoes.origem"]
significado = """
De onde veio a recomendação:

- `checklist:<id do item>`;
- `manual_constatacao:<id>`;
- `legacy_rec:<id>`.

O padrão da coluna, `checklist` sem id, marca linhas antigas; a função as reaproveita e as
renomeia.
"""
fonte = ["funcao:gerar_ncs_unidade(p_unidade_fiscalizada_id uuid, p_fotos jsonb, p_finalizar boolean)"]

