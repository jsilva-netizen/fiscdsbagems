[objeto."tabela:recomendacoes"]
modulo = "fiscalizacao"
finalidade = """
Recomendações à entidade: orientações sem prazo nem sanção, geradas quando o item ou a constatação
gera NC e tem texto de recomendação, mas não de determinação. Produção tem 350.

Como as determinações, são preservadas pela `origem` nas regenerações (texto e numeração
editados na tela ficam) e apagadas quando perdem a origem.
"""
fonte = [
  "funcao:gerar_ncs_unidade(p_unidade_fiscalizada_id uuid, p_fotos jsonb, p_finalizar boolean)",
  "src/lib/offline/repository.ts:870",
  "src/lib/offline/repository.ts:785",
]

