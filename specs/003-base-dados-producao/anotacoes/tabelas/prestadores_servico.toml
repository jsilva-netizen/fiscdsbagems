Identificador da entidade, gerado no aparelho quando ela é criada offline. É referenciado por
perfis de prestador, contratos, termos de notificação, respostas a determinações, autos de
infração, julgamentos e remessas.
"""
fonte = ["src/lib/offline/repository.ts:210", "restricao:profiles.profiles_prestador_servico_id_fkey"]

[objeto."coluna:prestadores_servico.nome"]
significado = """
Nome de exibição da entidade, obrigatório. Usado em listas, filtros, relatórios e na lista do
cadastro de usuário prestador.
"""
fonte = ["src/pages/DetalhePrestador.jsx:174", "src/pages/Register.jsx:43"]

[objeto."coluna:prestadores_servico.ativo"]
