[objeto."tabela:camaras_tecnicas"]
modulo = "core"
finalidade = """
As câmaras técnicas de cada diretoria. Produção tem 12:

- DSB: CATESA, CATERS e CRES;
- DTR: CATRANSP, CATERF, CATEFIS, CRET e CATERM (terminais rodoviários);
- DGE: CATEGAS, CATENE, CREG e CATESG (serviços de gás).

`caterm` e `catesg` existem só no banco: a lista da interface (`CAMARAS_POR_DIRETORIA`), o
mapa de dashboards (`CAMARA_DASHBOARD_PAGE`) e a tela de cadastro têm só as outras 10, então
nenhum usuário consegue escolhê-las.

A câmara organiza o acesso (usuário e registros têm câmara, e `can_access_camara` compara as
duas) e a navegação (cada câmara tem seu dashboard).
"""
fonte = [
  "inventário: dados_referencia.camaras_tecnicas",
  "src/hooks/useModulo.js:64",
  "src/lib/camaras.js:5",
  "src/pages/Register.jsx:8",
  "funcao:can_access_camara(row_camara text)",
]

[objeto."coluna:camaras_tecnicas.id"]
significado = """
Sigla da câmara em minúsculas (ex.: `caters`). É o valor gravado em `camara_tecnica_id` nos
perfis e nos registros (fiscalizações, autos, remessas…) e fixo no código da interface.
"""
fonte = ["restricao:profiles.profiles_camara_tecnica_id_fkey", "src/lib/camaras.js:5"]

[objeto."coluna:camaras_tecnicas.diretoria_id"]
significado = """
Diretoria a que a câmara pertence. Não pode ser apagada enquanto tiver câmara (`ON DELETE
RESTRICT`).
"""
fonte = ["restricao:camaras_tecnicas.camaras_tecnicas_diretoria_id_fkey"]

[objeto."coluna:camaras_tecnicas.nome"]
significado = "Nome da câmara, mostrado na tela de usuários."
fonte = ["src/pages/GerenciarUsuarios.jsx:63"]

[objeto."politica:public.camaras_tecnicas.Admins gerenciam câmaras técnicas"]
descricao = "Admin ativo lê, cria, altera e exclui câmaras. Não há tela para isso."
fonte = ["funcao:get_my_role()"]

[objeto."politica:public.camaras_tecnicas.Câmaras técnicas visíveis para todos autenticados"]
descricao = """
Qualquer logado lê as câmaras, inclusive conta não aprovada. É dado público de referência.
"""
fonte = ["src/pages/GerenciarUsuarios.jsx:63"]
