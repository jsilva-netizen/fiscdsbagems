[objeto."tabela:constatacoes_manuais"]
modulo = "fiscalizacao"
finalidade = """
Constatações que o fiscal escreve livremente na unidade, fora do checklist. Cada uma é numerada
junto com as respostas do checklist (C1, C2…). Pode gerar NC e, com ela, uma determinação ou uma
recomendação, com os textos da própria constatação. Produção tem 299, 123 delas gerando NC.

Criadas e editadas offline e sincronizadas pela fila. A NC, a determinação e a recomendação
correspondentes são feitas por `gerar_ncs_unidade`, com origem `manual_constatacao:<id>`.
"""
fonte = [
  "src/lib/offline/repository.ts:2268",
  "src/lib/offline/repository.ts:1820",
  "funcao:gerar_ncs_unidade(p_unidade_fiscalizada_id uuid, p_fotos jsonb, p_finalizar boolean)",
  "inventário: dominio_categorico",
]

[objeto."coluna:constatacoes_manuais.id"]
significado = """
Identificador, gerado no aparelho. Compõe a origem da determinação e da recomendação geradas
(`manual_constatacao:<id>`).
"""
fonte = ["funcao:gerar_ncs_unidade(p_unidade_fiscalizada_id uuid, p_fotos jsonb, p_finalizar boolean)"]

[objeto."coluna:constatacoes_manuais.unidade_fiscalizada_id"]
significado = "Unidade da constatação. Excluir a unidade exclui as constatações."
fonte = ["restricao:constatacoes_manuais.constatacoes_manuais_unidade_fiscalizada_id_fkey"]

