# Checklists — itens do checklist de cada tipo de unidade, versionados por inserção. A política
# "Public Access" não é anotada: foi removida de produção em 2026-09-29 (migration 138).

[objeto."tabela:itens_checklist"]
modulo = "checklists"
finalidade = """
Perguntas do checklist de cada tipo de unidade, com os textos que a vistoria gera conforme a
resposta: constatação, não conformidade, determinação e recomendação.

**Versionamento só por inserção (append-only).** Nenhuma linha é alterada nem apagada:

- a "chave" de um item é o tipo mais a `ordem` (ou, sem ordem, a pergunta);
- a linha mais recente de cada chave é a que vale;
- editar insere uma versão nova, e editar trocando a chave também insere uma versão inativa na
  chave antiga;
- excluir insere uma versão inativa.

Na vistoria, o app usa a versão vigente na data em que a unidade foi criada, dando preferência às
versões já respondidas. Assim, uma vistoria antiga continua com o texto da época.

Consequência: `ativo = true` não diz se a linha vale. Em produção, das 768 linhas, 525 são itens
vigentes e 243 são versões antigas, todas ainda com `ativo = true`. São 82 chaves com 2 a 5
versões, em 7 tipos; em 81 delas a pergunta é idêntica, o que indica reimportação da planilha.

- **Manutenção:** tela Checklists (formulário e importação de planilha Excel).
- **App offline:** baixa todas as linhas, inclusive as versões antigas.
"""
fonte = [
  "src/pages/Checklists.jsx:50",
  "src/pages/Checklists.jsx:100",
  "src/pages/Checklists.jsx:146",
  "src/lib/offline/repository.ts:670",
  "src/lib/offline/syncEngine.ts:2061",
  "specs/001-data-access-abstraction/debitos-tecnicos-e-inconsistencias.md",
  "inventário: dados_referencia.itens_checklist",
]

[objeto."coluna:itens_checklist.id"]
significado = """
Identificador de uma versão do item, gerado pela tela. A resposta da vistoria aponta para a versão
respondida (`respostas_checklist.item_checklist_id`), e é assim que o texto da época se preserva.
"""
fonte = ["src/pages/Checklists.jsx:100", "src/lib/offline/repository.ts:670"]

[objeto."coluna:itens_checklist.tipo_unidade_id"]
significado = """
Tipo de unidade a que o item pertence; faz parte da chave de versão. O banco aceita nulo. Apagar
o tipo apaga os itens em cascata, mas a tela de tipos nunca apaga, só inativa.
"""
fonte = ["restricao:itens_checklist.itens_checklist_tipo_unidade_id_fkey", "src/lib/offline/repository.ts:670"]

[objeto."coluna:itens_checklist.ordem"]
significado = """
Posição do item no checklist e parte da chave de versão: versões com o mesmo tipo e a mesma
ordem são o mesmo item. Mudar a ordem numa edição cria um item "novo" e inativa o da ordem
antiga. Em produção, todos têm ordem maior que zero.
"""
fonte = ["src/pages/Checklists.jsx:62", "src/pages/Checklists.jsx:131"]

[objeto."coluna:itens_checklist.pergunta"]
significado = """
Pergunta feita ao fiscal na vistoria, com resposta Sim ou Não. É a chave de versão quando o item
não tem ordem.
"""
fonte = ["src/pages/VistoriarUnidade.jsx:1420", "src/pages/Checklists.jsx:62"]

