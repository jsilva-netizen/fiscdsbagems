[objeto."tabela:julgamentos"]
modulo = "processo_sancionador"
finalidade = """
Julgamento de um auto de infração, a partir do parecer técnico: decisão, multa final e
justificativa. **Sem uso**: está vazia em produção, e a função que a grava
(`createJulgamentoOnline`) existe no código, mas nenhuma tela a chama. O julgamento é a etapa do
processo sancionador que o sistema atual ainda não cobre.
"""
fonte = ["src/lib/offline/repository.ts:1610", "inventário: tabelas"]

[objeto."coluna:julgamentos.id"]
significado = "Identificador do julgamento (tabela sem uso)."
