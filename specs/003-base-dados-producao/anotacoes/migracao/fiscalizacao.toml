[destino."coluna:unidades_fiscalizadas.tipo_unidade_id"]
para = ["fiscalizacao.RegistroCampo.catalogo_id", "fiscalizacao.RegistroCampo.item_versao_id", "fiscalizacao.RegistroCampo.tipo_avulso"]
transformacao = "Unidade de saneamento: o tipo vira o catálogo (mesmo identificador, spec 005). Ocorrência da DTR (tipo vazio): catálogo da CATERF, com o item e a versão ligados pelo app da CATERF (frente, PER e descrição) e o tipo avulso registrado por ele. Tipo inexistente vira legado."

[destino."coluna:unidades_fiscalizadas.tipo_unidade_nome"]
descarte = "Cópia do nome do tipo que o app não grava (A-025)."

[destino."coluna:unidades_fiscalizadas.nome_unidade"]
para = "fiscalizacao.RegistroCampo.nome"

[destino."coluna:unidades_fiscalizadas.codigo_unidade"]
para = "fiscalizacao.RegistroCampo.codigo"

[destino."coluna:unidades_fiscalizadas.endereco"]
para = "fiscalizacao.RegistroCampo.endereco"

[destino."coluna:unidades_fiscalizadas.latitude"]
para = ["fiscalizacao.RegistroCampo.latitude", "fiscalizacao.RegistroCampo.origem_ponto"]
transformacao = "Origem do ponto 'gps' quando há coordenada numérica."

[destino."coluna:unidades_fiscalizadas.longitude"]
para = "fiscalizacao.RegistroCampo.longitude"

[destino."coluna:unidades_fiscalizadas.gps_accuracy_m"]
para = ["fiscalizacao.RegistroCampo.precisao_m", "fiscalizacao.RegistroCampo.impreciso"]
transformacao = "Impreciso quando passa de 20 m (o limite de hoje); vazio nas unidades de saneamento, que ficam sem precisão."

[destino."coluna:unidades_fiscalizadas.coordenadas"]
para = ["fiscalizacao.RegistroCampo.coordenadas_digitadas", "fiscalizacao.RegistroCampo.origem_ponto"]
transformacao = "Texto como está. Sem coordenada numérica, o texto é convertido para latitude e longitude quando possível, com origem 'digitado'; o que não converte fica só no texto e é listado."

[destino."coluna:unidades_fiscalizadas.data_hora_vistoria"]
para = "fiscalizacao.RegistroCampo.data_hora_vistoria"

[destino."coluna:unidades_fiscalizadas.ordem"]
para = "fiscalizacao.RegistroCampo.ordem"
transformacao = "Vazia → posição pela criação, como o relatório de hoje ordena (ordem, depois criação); define a numeração contínua recalculada."

[destino."coluna:unidades_fiscalizadas.status"]
para = "fiscalizacao.RegistroCampo.situacao"
transformacao = "`finalizada` vira finalizado; `em_andamento` fica; `pendente` (4 em produção) vira em andamento com a marca de legado."

[destino."coluna:unidades_fiscalizadas.fotos_unidade"]
para = ["fiscalizacao.Foto.arquivo", "fiscalizacao.Foto.arquivo_original", "fiscalizacao.Foto.legenda", "fiscalizacao.Foto.ordem", "fiscalizacao.Foto.latitude", "fiscalizacao.Foto.longitude", "fiscalizacao.Foto.largura", "fiscalizacao.Foto.altura"]
transformacao = "Cada item da lista vira uma Foto, na mesma ordem: `bucket`/`path` → arquivo; `cleanBucket`/`cleanPath` → original (quando há); `localId` → identificador (se for UUID; senão, um novo); `resolucao_km` e `resolucao_rodovia` vão ao app da CATERF. O checksum é calculado na cópia do arquivo."

[destino."coluna:unidades_fiscalizadas.total_constatacoes"]
descarte = "Total calculado dos registros (A-025); a migração confere o total gravado contra o calculado e lista a diferença."

[destino."coluna:unidades_fiscalizadas.total_ncs"]
descarte = "Idem `total_constatacoes`."

[destino."coluna:unidades_fiscalizadas.total_determinacoes"]
descarte = "Nunca gravado pelo app atual (A-025, divergência defeito_corrigir)."

[destino."coluna:unidades_fiscalizadas.total_recomendacoes"]
descarte = "Nunca gravado pelo app atual (A-025, divergência defeito_corrigir)."

[destino."coluna:unidades_fiscalizadas.created_at"]
para = "fiscalizacao.RegistroCampo.criado_em"
transformacao = "Define a versão do catálogo da unidade; a migração confere que as respostas apontam para versões vigentes nessa data ou já respondidas."

[destino."coluna:unidades_fiscalizadas.updated_at"]
para = "fiscalizacao.RegistroCampo.atualizado_em"

# --- respostas_checklist (3.454) ---------------------------------------------------------

[destino."coluna:respostas_checklist.id"]
para = "fiscalizacao.Resposta.id"

[destino."coluna:respostas_checklist.unidade_fiscalizada_id"]
para = "fiscalizacao.Resposta.registro"

[destino."coluna:respostas_checklist.item_checklist_id"]
para = "fiscalizacao.Resposta.item_versao_id"
transformacao = "Mesmo identificador da versão migrada (spec 005); 100% das respostas precisam encontrar a versão, e a que não encontrar vira legado."

[destino."coluna:respostas_checklist.resposta"]
para = "fiscalizacao.Resposta.valor"
transformacao = "`SIM` → `sim`; `NAO` e `NÃO` → `nao`; vazio ou outro valor vira legado."

[destino."coluna:respostas_checklist.pergunta"]
para = ["fiscalizacao.RegistroGerado.texto", "fiscalizacao.RegistroGerado.suprimido"]
transformacao = "Cria o registro gerado do tipo `constatacao` da resposta (origem `resposta:<id>`, identificador novo), com o texto como está (inclusive o editado); pergunta vazia com resposta preenchida, num item que gera constatação, cria o registro suprimido."
[destino."coluna:respostas_checklist.observacao"]
para = "fiscalizacao.Resposta.observacao"

[destino."coluna:respostas_checklist.numero_constatacao"]
para = ["fiscalizacao.RegistroGerado.numero", "fiscalizacao.RegistroGerado.ordem"]
transformacao = "Na constatação da resposta: o número gravado (por unidade) vira a ordem, junto com o das constatações manuais da unidade, e fica no `legado`; o número é recalculado, contínuo na fiscalização, pela regra do relatório de hoje (F18 da spec 007)."
[destino."coluna:respostas_checklist.gera_nc"]
descarte = "Derivado do catálogo e da resposta (R-fiscalizacao-005); a migração confere, antes, que a marca bate com a declaração do item e a resposta (355 respostas com NC)."

[destino."coluna:respostas_checklist.comentario"]
descarte = "Campo antigo que a tela não usa (divergência residuo_descartar); a migração lista as respostas com valor nele."

[destino."coluna:respostas_checklist.created_at"]
para = "fiscalizacao.Resposta.criado_em"

[destino."coluna:respostas_checklist.updated_at"]
para = "fiscalizacao.Resposta.atualizado_em"

