# Mapa de migração do módulo fiscalização (spec 007). Destinos conferidos contra o data-model.
modulo = "fiscalizacao"
data_model = "specs/007-modulo-fiscalizacao/data-model.md"
notas = [
  "Ordem de carga: depois de core, checklists (versões dos itens) e do app da CATERF (catálogo e dados da rodovia), porque respostas e registros avulsos apontam para eles (research F18).",
  "Toda fiscalização migrada recebe `origem = migrada`, sem atividade planejada e sem contar como pendência de ligação (spec, 'Casos conhecidos').",
  "O número do termo migra como está; os de C, NC, D e R são recalculados, contínuos na fiscalização, pela regra do relatório de hoje (a dos documentos emitidos; R-fiscalizacao-008), e os gravados (por unidade) ficam no legado; a sequência de termos de cada ano continua do maior número migrado (R-fiscalizacao-013). A numeração das fiscalizações migradas e finalizadas fica congelada.",
  "Registros que as regras novas recusariam são carregados e marcados em `legado`, com o motivo no relatório de conferência (MIG-4).",
  "As colunas da DTR nas tabelas deste módulo (rodovia, km, sentido, frente, per, não atendimento, prazo da NC, gravidade, trecho, tipo de ocorrência, KM impreciso) são do módulo dtr e entram no mapa dele.",
]

# --- fiscalizacoes (26) ------------------------------------------------------------------

[destino."coluna:fiscalizacoes.id"]
para = "fiscalizacao.Fiscalizacao.id"

[destino."coluna:fiscalizacoes.camara_tecnica_id"]
para = "fiscalizacao.Fiscalizacao.camara"
transformacao = "Vazia: deduzida dos serviços pela regra corrigida do A-021. Sem dedução possível, a fiscalização é carregada com a marca de legado 'sem câmara' e fica visível só ao administrador até ser classificada (premissa do core)."

[destino."coluna:fiscalizacoes.municipio_id"]
para = ["fiscalizacao.Fiscalizacao.municipio", "fiscalizacao.Fiscalizacao.destinos"]
transformacao = "O município vira também o destino do tipo município. Vazio nas fiscalizações rodoviárias, cujos destinos (concessão e rodovia) vêm do app da CATERF. Município inexistente (não há chave em produção, A-037) é carregado como legado e listado."

[destino."coluna:fiscalizacoes.municipio_nome"]
descarte = "Cópia do nome do município, que vem do core. A migração confere a cópia contra o município antes do descarte, e a divergência vai para o relatório."

[destino."coluna:fiscalizacoes.prestador_servico_id"]
para = "fiscalizacao.Fiscalizacao.entidade"
transformacao = "Entidade inexistente (sem chave em produção, A-037) é carregada como legado e listada."

[destino."coluna:fiscalizacoes.prestador_servico_nome"]
descarte = "Cópia do nome da entidade, que vem do core; conferida antes do descarte, como o município."

[destino."coluna:fiscalizacoes.servicos"]
para = "fiscalizacao.Fiscalizacao.servicos"
transformacao = "Cada texto vira o serviço do core (a ordem da lista não importa); serviço fora da câmara da fiscalização vira legado."

[destino."coluna:fiscalizacoes.fiscal_email"]
para = ["fiscalizacao.Fiscalizacao.responsavel", "fiscalizacao.MembroEquipe.usuario"]
transformacao = "O usuário do e-mail vira o responsável e o único membro da equipe (origem 'informado'). E-mail sem usuário é guardado na marca de legado."

[destino."coluna:fiscalizacoes.fiscal_nome"]
para = "fiscalizacao.Fiscalizacao.responsavel"
transformacao = "Usado só quando o e-mail não identifica o usuário; o nome fica na marca de legado."

[destino."coluna:fiscalizacoes.data_inicio"]
para = "fiscalizacao.Fiscalizacao.data_inicio"

[destino."coluna:fiscalizacoes.data_fim"]
para = "fiscalizacao.Fiscalizacao.data_fim"

[destino."coluna:fiscalizacoes.status"]
para = ["fiscalizacao.Fiscalizacao.situacao", "fiscalizacao.Fiscalizacao.numeracao_congelada"]
transformacao = "`finalizada` também congela a numeração (19 fiscalizações); `em_andamento` fica aberta (7)."

[destino."coluna:fiscalizacoes.numero_termo"]
para = "fiscalizacao.Fiscalizacao.numero_termo"
transformacao = "Como está; alimenta a sequência do ano (SequenciaTermo)."

[destino."coluna:fiscalizacoes.created_at"]
para = "fiscalizacao.Fiscalizacao.criado_em"

[destino."coluna:fiscalizacoes.updated_at"]
para = "fiscalizacao.Fiscalizacao.atualizado_em"

[destino."coluna:fiscalizacoes.created_by"]
para = "fiscalizacao.Fiscalizacao.criado_por"

[destino."coluna:fiscalizacoes.last_modified_by"]
descarte = "Quem alterou por último está na auditoria migrada (R-fiscalizacao-024); a migração confere que a auditoria tem a mesma última alteração."

[destino."coluna:fiscalizacoes.last_modified_at"]
descarte = "Idem `last_modified_by`."

[destino."coluna:fiscalizacoes.latitude_inicio"]
descarte = "O app não grava (A-025)."

[destino."coluna:fiscalizacoes.longitude_inicio"]
descarte = "O app não grava (A-025)."

[destino."coluna:fiscalizacoes.tipo_modulo"]
descarte = "A diretoria vem da câmara (R-fiscalizacao-001, R-fiscalizacao-025); a migração confere que o módulo bate com a diretoria da câmara (24 DSB, 2 DTR) e lista a divergência."

# --- unidades_fiscalizadas (402) ---------------------------------------------------------

[destino."coluna:unidades_fiscalizadas.id"]
para = "fiscalizacao.RegistroCampo.id"

[destino."coluna:unidades_fiscalizadas.fiscalizacao_id"]
