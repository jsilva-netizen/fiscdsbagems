# --- determinacoes (183) -----------------------------------------------------------------

[destino."coluna:determinacoes.id"]
para = ["fiscalizacao.RegistroGerado.id", "fiscalizacao.RegistroGerado.tipo"]
transformacao = "Registro gerado do tipo `determinacao`, com o mesmo identificador."
[destino."coluna:determinacoes.unidade_fiscalizada_id"]
para = "fiscalizacao.RegistroGerado.registro"
[destino."coluna:determinacoes.origem"]
para = ["fiscalizacao.RegistroGerado.origem", "fiscalizacao.RegistroGerado.acrescentado"]
transformacao = "`checklist:<item>` → `resposta:<id da resposta daquele item na unidade>`; `manual_constatacao:<id>` → `manual:<id>`; `legacy:<id>` fica e vira legado. Determinação criada à mão pela equipe fica `acrescentado`."
[destino."coluna:determinacoes.nao_conformidade_id"]
para = "fiscalizacao.RegistroGerado.referencia"
transformacao = "A NC referenciada. Vazio → religada pela origem (a NC da mesma resposta ou entrada manual) ou, sem ela, pelo número de NC citado no texto, como o relatório de hoje; sem nenhum dos dois, a determinação é carregada como legado e listada na conferência."
[destino."coluna:determinacoes.descricao"]
para = ["fiscalizacao.RegistroGerado.texto", "fiscalizacao.RegistroGerado.texto_editado"]
transformacao = "Texto como está, marcado como editado, para a consolidação nunca reescrever o texto migrado; só o número de NC citado (\"Sanar NC<n>\") é reescrito pela numeração recalculada, como o relatório de hoje faz."
[destino."coluna:determinacoes.prazo_dias"]
para = "fiscalizacao.RegistroGerado.prazo_dias"
transformacao = "Vazio (1 em produção) vira 30, com a marca de legado."
[destino."coluna:determinacoes.data_limite"]
para = "fiscalizacao.RegistroGerado.data_limite"
[destino."coluna:determinacoes.numero_determinacao"]
para = ["fiscalizacao.RegistroGerado.numero", "fiscalizacao.RegistroGerado.ordem"]
transformacao = "O gravado (por unidade) vira a ordem entre as da mesma NC e fica no `legado`; o número é recalculado na ordem das NCs, contínuo na fiscalização."
[destino."coluna:determinacoes.prazo"]
descarte = "Coluna antiga que ninguém grava (A-025)."

[destino."coluna:determinacoes.status"]
descarte = "Nada muda a situação (as 183 estão pendentes); o cumprimento é do processo sancionador (R-fiscalizacao-009). A migração confere que todas estão pendentes."

[destino."coluna:determinacoes.created_at"]
para = "fiscalizacao.RegistroGerado.criado_em"
[destino."coluna:determinacoes.updated_at"]
para = "fiscalizacao.RegistroGerado.atualizado_em"
