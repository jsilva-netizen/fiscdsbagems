para = "fiscalizacao.RegistroGerado.numero"
transformacao = "Recalculado na ordem das constatações, contínuo na fiscalização (regra do relatório de hoje); o gravado (ordem de finalização) fica no `legado`."
[destino."coluna:nao_conformidades.created_at"]
