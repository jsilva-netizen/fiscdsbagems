# Mapa de migração do módulo processo_sancionador (spec 011). Destinos conferidos contra o data-model.
modulo = "processo_sancionador"
data_model = "specs/011-modulo-processo-sancionador/data-model.md"
notas = [
  "Ordem de carga: depois de core e fiscalização (as determinações, já migradas com os identificadores de produção, viram os retratos notificados) (research N16).",
  "O comando exige a lista de identificadores de teste fechada com o responsável (A-002): as 34 respostas e as 20 evidências de produção são de teste.",
  "Cada termo vira um processo e um termo com o mesmo identificador; a etapa é deduzida dos dados, e a situação gravada fica em `situacao_legado`.",
  "Autos, remessas, itens e pareceres estão vazios; as tabelas de manifestações e de julgamentos não são levadas (A-030).",
]

# --- termos de notificação → processo e termo --------------------------------------------

[destino."coluna:termos_notificacao.id"]
para = ["processo_sancionador.ProcessoSancionador.id", "processo_sancionador.TermoNotificacao.id"]
transformacao = "O mesmo identificador no processo e no termo."

[destino."coluna:termos_notificacao.numero_processo"]
para = "processo_sancionador.ProcessoSancionador.numero_processo"

[destino."coluna:termos_notificacao.fiscalizacao_id"]
para = "processo_sancionador.ProcessoSancionador.fiscalizacao"
transformacao = "As determinações da fiscalização viram os retratos notificados (`DeterminacaoNotificada`), na ordem do número."

[destino."coluna:termos_notificacao.prestador_servico_id"]
para = "processo_sancionador.ProcessoSancionador.entidade"

[destino."coluna:termos_notificacao.municipio_id"]
para = "processo_sancionador.ProcessoSancionador.municipio"

[destino."coluna:termos_notificacao.camara_tecnica"]
para = ["processo_sancionador.ProcessoSancionador.camara", "processo_sancionador.TermoNotificacao.camara"]
transformacao = "Texto em maiúsculas (`CATESA`, `CATERS`) ligado à câmara do core pela sigla; conferido contra a câmara da fiscalização, e divergência vai para `legado`."

[destino."coluna:termos_notificacao.numero_termo_notificacao"]
para = "processo_sancionador.TermoNotificacao.numero"
transformacao = "Migrado como está; número repetido ou fora do formato vai para o relatório de conferência. A sequência de TN de cada diretoria e ano começa no maior número migrado."

[destino."coluna:termos_notificacao.tipo_relatorio"]
para = "processo_sancionador.TermoNotificacao.tipo_relatorio"

[destino."coluna:termos_notificacao.numero_rfp"]
para = "processo_sancionador.TermoNotificacao.numero_relatorio"

[destino."coluna:termos_notificacao.ano_geracao"]
para = "processo_sancionador.TermoNotificacao.ano_relatorio"

[destino."coluna:termos_notificacao.data_geracao"]
para = ["processo_sancionador.TermoNotificacao.criado_em", "processo_sancionador.TermoNotificacao.emitido_em"]
transformacao = "`emitido_em` só quando o termo tem o TN e o relatório assinados; senão fica vazio (pendente de emissão)."

[destino."coluna:termos_notificacao.fluxo_manual"]
para = "processo_sancionador.TermoNotificacao.fluxo"
transformacao = "`true` → `manual`; `false` → `portal`."

[destino."coluna:termos_notificacao.prazo_resposta_dias"]
para = "processo_sancionador.TermoNotificacao.prazo_resposta_dias"

[destino."coluna:termos_notificacao.observacoes"]
para = "processo_sancionador.TermoNotificacao.observacoes"

[destino."coluna:termos_notificacao.data_protocolo"]
para = "processo_sancionador.TermoNotificacao.data_protocolo"

[destino."coluna:termos_notificacao.data_inicio_prazo"]
para = "processo_sancionador.TermoNotificacao.inicio_prazo"

[destino."coluna:termos_notificacao.data_maxima_resposta"]
para = "processo_sancionador.TermoNotificacao.data_limite"
transformacao = "Migrada como está; a conferência compara com início + prazo e lista as diferenças, sem recalcular."

[destino."coluna:termos_notificacao.data_assinatura_prestador"]
para = "processo_sancionador.TermoNotificacao.assinatura_entidade_em"

[destino."coluna:termos_notificacao.assinatura_prestador_valida"]
para = "processo_sancionador.TermoNotificacao.assinatura_aceita"

[destino."coluna:termos_notificacao.data_recebimento_resposta"]
para = "processo_sancionador.TermoNotificacao.resposta_recebida_em"

[destino."coluna:termos_notificacao.recebida_no_prazo"]
para = "processo_sancionador.TermoNotificacao.resposta_no_prazo"

[destino."coluna:termos_notificacao.status"]
para = ["processo_sancionador.TermoNotificacao.situacao_legado", "processo_sancionador.ProcessoSancionador.etapa"]
transformacao = "O valor gravado fica em `situacao_legado`; a etapa é deduzida dos dados (AM concluída → autos e defesa ou encerrado; resposta recebida → análise da manifestação; senão notificação). A conferência lista a situação calculada que difere da gravada."

[destino."coluna:termos_notificacao.numero_am"]
para = "processo_sancionador.AnaliseManifestacao.numero"
transformacao = "Termo com número de AM ganha a AM versão 1, concluída, com as análises das respostas; a sequência de AM começa no maior número migrado."

[destino."coluna:termos_notificacao.am_concluida_em"]
para = "processo_sancionador.AnaliseManifestacao.concluida_em"

[destino."coluna:termos_notificacao.created_at"]
para = "processo_sancionador.ProcessoSancionador.criado_em"

[destino."coluna:termos_notificacao.updated_at"]
para = ["processo_sancionador.ProcessoSancionador.atualizado_em", "processo_sancionador.TermoNotificacao.atualizado_em"]

[destino."coluna:termos_notificacao.arquivo_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Documento `tn_agems` do termo: caminho extraído do endereço, arquivo copiado para o repositório privado, checksum conferido."

[destino."coluna:termos_notificacao.arquivo_rfp_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `relatorio`."

[destino."coluna:termos_notificacao.arquivo_protocolo_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `protocolo`."

[destino."coluna:termos_notificacao.arquivo_oficio_protocolo"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `oficio_protocolo`."

[destino."coluna:termos_notificacao.arquivo_tn_prestador_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `tn_entidade` e `pela_entidade` verdadeiro."

[destino."coluna:termos_notificacao.arquivos_resposta"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.nome_original"]
transformacao = "Cada item da lista vira um documento do termo: categoria `termo_envio` → tipo `termo_envio`; demais → `resposta_manual`; nome, tamanho e data do item conferidos com o arquivo."

[destino."coluna:termos_notificacao.arquivo_resposta_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `resposta_manual`."

[destino."coluna:termos_notificacao.arquivo_oficio_resposta"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Como o TN, com o tipo `oficio_resposta`."

[destino."coluna:termos_notificacao.arquivo_am_assinada_url"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.tipo"]
transformacao = "Documento `am_assinada` da AM versão 1."

# --- respostas às determinações (34, de teste) ------------------------------------------

[destino."coluna:respostas_determinacao.id"]
para = "processo_sancionador.RespostaDeterminacao.id"
transformacao = "Só as que não estão na lista de teste (A-002); hoje, nenhuma."

[destino."coluna:respostas_determinacao.determinacao_id"]
para = "processo_sancionador.RespostaDeterminacao.determinacao"
transformacao = "Ligada ao retrato notificado da mesma determinação (`DeterminacaoNotificada.determinacao_id`)."

[destino."coluna:respostas_determinacao.unidade_fiscalizada_id"]
para = "processo_sancionador.DeterminacaoNotificada.registro_id"
transformacao = "Conferido contra a unidade da determinação; divergência vai para `legado` do processo."

[destino."coluna:respostas_determinacao.fiscalizacao_id"]
descarte = "Derivado do processo; conferido contra a fiscalização do termo antes do descarte."

[destino."coluna:respostas_determinacao.prestador_servico_id"]
descarte = "Derivado do processo; conferido contra a entidade do termo antes do descarte."

[destino."coluna:respostas_determinacao.manifestacao_prestador"]
para = "processo_sancionador.RespostaDeterminacao.manifestacao"

[destino."coluna:respostas_determinacao.status"]
para = ["processo_sancionador.RespostaDeterminacao.situacao", "processo_sancionador.AnaliseResposta.resultado"]
transformacao = "`rascunho` → rascunho; `aguardando_analise` → enviada; `atendida` → enviada, com análise `acatada`; `nao_atendida` → enviada, com análise `nao_acatada` (na AM do termo)."

[destino."coluna:respostas_determinacao.descricao_atendimento"]
para = "processo_sancionador.AnaliseResposta.texto"

[destino."coluna:respostas_determinacao.dentro_prazo"]
para = "processo_sancionador.RespostaDeterminacao.no_prazo"

[destino."coluna:respostas_determinacao.data_resposta"]
para = "processo_sancionador.RespostaDeterminacao.enviada_em"
transformacao = "Migrada como está; a análise da equipe sobrescrevia esta data, e a conferência marca as respostas analisadas cuja data coincide com a da análise."

[destino."coluna:respostas_determinacao.created_at"]
para = "processo_sancionador.RespostaDeterminacao.criado_em"

[destino."coluna:respostas_determinacao.evidencias"]
para = ["processo_sancionador.DocumentoProcesso.arquivo", "processo_sancionador.DocumentoProcesso.nome_original"]
transformacao = "Cada item vira documento `evidencia` da resposta, com `pela_entidade` verdadeiro."

[destino."coluna:respostas_determinacao.resposta"]
descarte = "Sem uso: nenhuma tela grava (R-sancionador-022)."

[destino."coluna:respostas_determinacao.tipo_resposta"]
descarte = "Sem uso: nenhuma tela lê nem grava (R-sancionador-022)."

