[objeto."funcao:admin_delete_user(p_user_id uuid)"]
modulo = "core"
finalidade = """
Exclui definitivamente um usuário: o perfil e a conta de autenticação. Só um admin ativo pode, e
ninguém exclui a si mesmo. Roda com permissão elevada para poder apagar em `auth.users`.

Na prática, só funciona para quem nunca criou nada no sistema. Estas tabelas apontam para a conta
ou o perfil sem regra de exclusão, e a exclusão falha inteira se houver registro do usuário nelas:

- `fiscalizacoes.created_by`;
- `relatorios_jobs.requested_by`;
- `prestadores_servico.user_id`;
- a autoria das tabelas do CATERS.

Serve para remover cadastros recusados ou duplicados. A tela de cadastro orienta a pedir isso
quando o e-mail já existe.
"""
fonte = [
  "src/pages/GerenciarUsuarios.jsx:123",
  "src/pages/Register.jsx:119",
  "restricao:fiscalizacoes.fiscalizacoes_created_by_fkey",
  "restricao:relatorios_jobs.relatorios_jobs_requested_by_fkey",
  "restricao:prestadores_servico.prestadores_servico_user_id_fkey",
]
chamada_por = ["src/pages/GerenciarUsuarios.jsx:123 (excluir usuário da lista)"]
regra_de_negocio = """
Exclusão definitiva só por admin ativo e nunca de si mesmo. Para quem já atuou, o caminho é
desativar (`ativo = false`), não excluir. A spec do core deve tornar isso explícito.
"""
