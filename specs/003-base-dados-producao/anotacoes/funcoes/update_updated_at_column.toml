[objeto."funcao:update_updated_at_column()"]
modulo = "core"
finalidade = """
Função genérica de gatilho: antes de cada alteração, grava a hora atual em `updated_at`. Usada em
6 tabelas: contratos, determinações, fiscalizações, prestadores, tipos de ocorrência da DTR e
unidades fiscalizadas.

A sincronização offline baixa só o que mudou desde a última vez, comparando esta coluna. Por isso,
tabela sincronizada sem este gatilho depende de o aparelho gravar `updated_at`.
"""
