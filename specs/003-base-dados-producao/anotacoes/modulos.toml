# Módulos do levantamento e ordem de especificação (research.md D6; contracts/anotacoes.md).
# Ordem testada contra as 65 chaves estrangeiras de produção em 2026-09-29, sem violação.
# `spec` é preenchido quando a spec do módulo existir; até lá, os objetos do módulo aparecem como LACUNA.

[[modulo]]
id = "core"
nome = "Core"
ordem = 1
app = "core"
spec = ""
observacao = "Identidade, perfis, diretorias e câmaras técnicas, municípios, prestadores (entidades reguladas), contratos (instrumentos), auditoria e as funções de permissão usadas pelas políticas de todos os módulos."

[[modulo]]
id = "checklists"
nome = "Checklists"
ordem = 2
app = "checklists"
spec = ""
observacao = "Motor genérico de verificação (\"lego\"): catálogos, itens versionados, campos, respostas, saídas, importação e cópia offline, sem nada de nenhuma câmara; cada app de câmara registra o seu modelo de catálogo (DSB: checklist por tipo de unidade; DTR: ocorrências do PER). Spec 005."

[[modulo]]
id = "planejamento"
nome = "Planejamento de fiscalizações"
ordem = 3
app = "planejamento"
spec = ""
observacao = "Funcionalidade nova, sem objeto no banco atual (decisão do responsável, 2026-09-30). O coordenador elabora o planejamento anual de fiscalizações (municípios, concessões ou rodovias a fiscalizar, equipe, datas, veículos e diárias), o diretor aprova, os fiscais consultam, e o planejamento aprovado segue para as áreas pertinentes (RH para a folha de ponto, financeiro para as diárias, frotas para a reserva de veículos), que virão como apps próprios, interligados, ou por integração externa. Vem antes da fiscalização, que executa o que foi planejado."

[[modulo]]
id = "fiscalizacao"
nome = "Fiscalização"
ordem = 4
app = "fiscalização"
spec = ""
observacao = "Fiscalização de campo comum às câmaras, incluindo a operação offline e a geração de relatórios."

[[modulo]]
id = "dtr"
nome = "DTR"
ordem = 5
app = "app da CATERF (câmara da DTR que fiscaliza as rodovias; decisão do responsável, 2026-09-30)"
spec = ""
observacao = "Especificidades da DTR (campos da rodovia no catálogo de ocorrências e nas ocorrências, mapa e KML); o catálogo de tipos é do motor de verificação (checklists) e o fluxo usa as tabelas do módulo fiscalização."

[[modulo]]
id = "processo_sancionador"
nome = "Processo sancionador"
ordem = 6
app = "processo sancionador"
spec = ""
observacao = "Termos de notificação, respostas a determinações, autos de infração (AI), manifestações, pareceres técnicos, julgamentos e remessas de autos de infração à entidade (remessas_ai: AI aqui é auto de infração)."

[[modulo]]
id = "caters"
nome = "CATERS"
ordem = 7
app = "app da câmara CATERS"
spec = ""
observacao = "Processos e recomendações da câmara de resíduos sólidos. As análises por IA (caters_ai_jobs) não serão refeitas no sistema novo (A-039)."

[[modulo]]
id = "catesa"
nome = "CATESA"
ordem = 8
app = "app da câmara CATESA"
spec = ""
observacao = "Sem objeto próprio no sistema novo: a única funcionalidade específica da CATESA no banco atual é a análise por IA da resposta ao termo (catesa_ai_jobs), que não será refeita (A-039). A câmara segue existindo no core e nos demais módulos."

[[modulo]]
id = "portal_prestador"
nome = "Portal do prestador"
ordem = 9
app = "portal do prestador"
spec = ""
observacao = "Sem tabela própria no banco atual: existe como políticas de acesso para o papel prestador e como telas. É dono da regra 'o prestador só vê a fiscalização depois de receber termo de notificação' (can_access_fiscalizacao, can_access_unidade e as políticas que as usam), que depende de fiscalização e processo sancionador e por isso fica depois deles."

[[modulo]]
id = "tramitacao"
nome = "Tramitação de documentos e dados"
ordem = 10
app = "tramitação de documentos e dados"
spec = ""
observacao = "Sem tabela própria no banco atual. Se corresponde a algo que já existe (remessas, respostas, histórico de análise) ou é funcionalidade nova é pergunta aberta da avaliação."
