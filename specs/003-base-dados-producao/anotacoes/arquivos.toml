# Repositórios de arquivos (buckets) e as políticas de storage.objects (T029).
#
# Estado descrito: produção depois da migration 138 (2026-09-29). Toda política para
# `authenticated` passou a exigir perfil ativo — `(SELECT get_my_role()) IS NOT NULL` — além do
# bucket. O inventário refeito em 2026-09-29 já mostra essas condições.
#
# Visão geral: nenhuma política olha o caminho do arquivo, a câmara ou a entidade. Qualquer
# usuário ativo, inclusive o prestador, lê, envia, troca e apaga qualquer arquivo de qualquer
# bucket privado. A proteção de cada documento está só nas tabelas que guardam a referência.
#
# Referências no banco usam o formato `storage://<bucket>/<caminho>`, lido por
# `Repository.parseStorageUrl` (src/lib/offline/repository.ts:89), que também entende endereços
# públicos e assinados do Storage. Arquivos privados são abertos por endereço assinado.

# --- Buckets -----------------------------------------------------------------------------------

